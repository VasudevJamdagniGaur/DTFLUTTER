name: deite
description: Deite — emotional wellness & social app (Flutter port of SocialMedia)
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  firebase_core: ^3.8.1
  firebase_auth: ^5.3.4
  cloud_firestore: ^5.6.0
  firebase_storage: ^12.4.0
  google_sign_in: ^6.2.2
  go_router: ^14.6.2
  provider: ^6.1.2
  http: ^1.2.2
  intl: ^0.19.0
  shared_preferences: ^2.3.3
  image_picker: ^1.1.2
  fl_chart: ^0.69.2
  url_launcher: ^6.3.1
  share_plus: ^10.1.3
  cross_file: ^0.3.4+2
  cached_network_image: ^3.4.1
  xml: ^6.5.0
  flutter_image_compress: ^2.3.0
  screenshot: ^3.0.0
  path_provider: ^2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
